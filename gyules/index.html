<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gyűlésvezetés">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gyűlésvezetés segédlet</title>
<style>
:root{
  --bg:#f3f7f6; --card:#ffffff; --ink:#16232e; --muted:#5b6b78; --line:#d6e0e4;
  --blue:#1f4e79; --blue2:#2c6aa3; --green:#2e7d5b; --green2:#3a9a70; --amber:#a86b12;
  --fs:20px;
}
body.ending{ --bg:#fbe3ec; --card:#fff3f7; --line:#f0c4d4; }
body.dark{
  --bg:#0f1519; --card:#182229; --ink:#e6edf1; --muted:#97a7b3; --line:#2a3842;
  --blue:#5b9bd5; --blue2:#7db3e3; --green:#4fbf8b; --green2:#6fd3a3; --amber:#e0a84a;
}
body.dark{ color-scheme:dark; }
body.dark.ending{ --bg:#4a0f1f; --card:#5c1628; --line:#7a2a3e; }
body{transition:background-color 1.5s}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs);line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--card);position:sticky;top:0;z-index:5}
header .title{flex:1;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);text-align:right;line-height:1.2}
.clock b{color:var(--ink)}
.clock .over{color:#c0392b}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  min-width:40px;height:40px;font-size:16px;font-weight:600;cursor:pointer}
.progress{height:4px;background:var(--line)}
.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0;transition:width .3s}
main{flex:1;padding:18px 16px 12px;display:flex;flex-direction:column}
.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);font-weight:700;margin-bottom:6px}
h1{font-size:1.15em;margin:0 0 14px;color:var(--blue)}
.say{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;
  padding:16px 18px;margin-bottom:14px}
.say p{margin:0 0 .6em}
.say p:last-child{margin-bottom:0}
.say .q{font-weight:600}
.note{color:var(--muted);font-size:.8em;margin:0 0 14px;padding-left:4px}
.note b{color:var(--amber)}
details.reading{background:var(--card);border:1px dashed var(--green);border-radius:14px;margin-bottom:14px}
details.reading summary{padding:12px 16px;cursor:pointer;color:var(--green);font-weight:600;font-size:.85em}
details.reading .body{padding:0 18px 16px;white-space:pre-line}
details.reading .ph{color:var(--muted);font-style:italic;font-size:.85em}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.75em;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;font:inherit;font-size:.9em;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.spacer{flex:1}
footer{position:sticky;bottom:0;background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.choices{display:flex;gap:10px;margin-bottom:10px}
.btn{flex:1;font:inherit;font-weight:700;font-size:1em;padding:16px 10px;border-radius:14px;border:0;cursor:pointer;
  color:#fff;background:var(--blue2);min-height:60px}
.btn.yes{background:var(--green)}
.btn.no{background:var(--blue)}
.btn.next{background:var(--blue)}
.btn:active{transform:scale(.98);filter:brightness(1.1)}
.back{width:100%;font:inherit;font-size:.8em;padding:10px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer}
.back[disabled]{opacity:.35}
.row{display:flex;gap:10px}
.row .back{flex:1}
.muted{color:var(--muted);font-size:.8em}
.done{text-align:center;padding-top:30px}
.done .big{font-size:2.4em}
.wl{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%}
.modal .box p{margin-top:0}
.modal .box{max-height:90vh;overflow:auto}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.menu button{font:inherit;font-size:.85em;font-weight:600;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.menu button .i{display:block;margin-bottom:4px;color:var(--green)}
.ic{vertical-align:middle;flex:none}
summary .ic{margin-top:-3px}
.pill .ic{margin-top:-2px}
.pill{font-size:13px;font-weight:700;background:var(--amber);color:#fff;border-radius:999px;padding:3px 8px;cursor:pointer;border:0}
.seg{display:flex;gap:6px;margin:4px 0 14px}
.seg button{flex:1;font:inherit;font-size:.8em;font-weight:600;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.85em;cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .db{font-size:1.3em;font-weight:700;color:var(--green);min-width:2.2em;text-align:right}
.item .db.zero{color:#c0392b}
.item input.cnt{width:4.5em;font:inherit;font-size:1.1em;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.search{width:100%;font:inherit;font-size:.85em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.mini{font:inherit;font-size:.75em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.big-num{font-size:2em;font-weight:800;color:var(--green);margin:4px 0 2px}
.big-num span{display:block;font-size:.35em;font-weight:500;color:var(--muted)}
h2.sub{font-size:.85em;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin:18px 0 8px}
.msg{font-size:.85em;margin:8px 0;min-height:1em}
a{color:var(--blue2)}
.field textarea{width:100%;font:inherit;font-size:.9em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:45vh;resize:vertical}
.pont{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.85em}
.pont .grow{flex:1}
.field textarea.kicsi{min-height:5.5em}
.pont.fix{color:var(--muted)}
.osszegzo{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.8em}
.lepesek{font-size:12px;color:var(--muted);margin-bottom:4px}
.msg.ok{color:var(--green)} .msg.err,.errtxt{color:#c0392b}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="homeBtn" title="Kezdőlap / beállítások">☰</button>
    <div class="title" id="hdrTitle">Gyűlésvezetés</div>
    <button class="pill" id="sorJelzo" style="display:none" title=""></button>
    <div class="clock" id="clock"></div>
    <button class="icon-btn" id="fsMinus" title="Kisebb betű">A−</button>
    <button class="icon-btn" id="fsPlus" title="Nagyobb betű">A+</button>
    <button class="icon-btn" id="darkBtn" title="Sötét mód"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<div class="modal" id="modal"><div class="box">
  <p id="modalText"></p>
  <div class="row"><button class="back" id="modalNo">Mégse</button><button class="btn yes" id="modalYes" style="min-height:44px;padding:10px">Igen</button></div>
</div></div>

<script>
/* =====================================================================
   FELOLVASANDÓ SZÖVEGEK
   Ide lehet beírni a teljes szövegeket. Üresen hagyva csak egy
   emlékeztető jelenik meg a lenyitható dobozban.
   ===================================================================== */
const READINGS = {
  meghatarozas:   { title: "Az Anonim Alkoholisták meghatározása", text: "Az Anonim Alkoholisták olyan emberek közössége, akik megosztják egymással tapasztalataikat, erejüket és reményüket azért, hogy megoldhassák közös problémájukat és segíthessenek másoknak felépülni az alkoholizmusból.\n\nA tagság egyetlen feltétele az ivással való felhagyás vágya. Az A.A.-tagság nem jár illetékkel vagy díjjal, mi önellátók vagyunk saját hozzájárulásainkból.\n\nAz A.A. nem szövetkezik semmiféle szektával, felekezettel, szervezettel vagy intézménnyel, nem politizál; nem kíván semmiféle vitába bocsátkozni, nem támogat és nem ellenez semmilyen ügyet.\n\nElsődleges célunk józannak maradni és segíteni más alkoholisták józanodását." },
  hogyanMukodik:  { title: "Anonim Alkoholisták, 5. fejezet – Hogyan működik (részlet)", text: "Ritkán fordult elő, hogy valaki lelkiismeretesen járta utunkat, és mégis kudarcot vallott. Általában azok az emberek nem épülnek fel, akik nem tudják, vagy nem akarják fenntartás nélkül követni egyszerű programunkat: azokról a férfiakról és nőkről van szó, akik alkatuknál fogva képtelenek önmagukkal szemben őszinték lenni. Vannak ilyen szerencsétlenek. Nem tehetnek róla, úgy látszik, ilyennek születtek. Természetüknél fogva képtelenek a teljes őszinteséget követelő életstílus megértésére és kialakítására. Esélyük a felépülésre az átlag alatt marad. Vannak súlyos érzelmi és elmebeli rendellenességben szenvedő emberek is, de sokan még közülük is felépülhetnek, ha képesek őszinték lenni önmagukhoz.\n\nTörténeteink közérthetően tárják fel, milyenek voltunk, mi történt velünk, és milyenek vagyunk most. Ha úgy határozott, hogy részesülni akar abból, ami nekünk megadatott, és ezért bármire hajlandó, akkor készen áll arra, hogy bizonyos lépéseket megtegyen.\n\nEgyes lépéseknél megtorpantunk. Azt hittük, könnyebb, kényelmesebb megoldást is találhatunk. De nem tudtunk. Ezért a lehető legkomolyabban kérjük, kezdettől fogva tegyen félre minden félelmet, és legyen nagyon alapos. Néhányan megpróbáltunk korábbi elgondolásainkhoz ragaszkodni, de semmire sem mentünk, amíg teljes mértékben fel nem hagytunk ezzel.\n\nNe feledje, alkohollal van dolgunk. Alattomos, megtévesztő, hatalmas erejű alkohollal! Ha nem kapunk segítséget, leteper minket. De van Valaki, aki mindenre képes. Ez nem más, mint Isten. Reméljük, ezúttal megtalálja Őt.\n\nFélmegoldások semmire sem vittek. Válaszútnál álltunk. Az Ő oltalmát és gondoskodását kértük teljes ráhagyatkozással. Íme a Lépések, amelyeket megtettünk, és felépülési programként javasolunk:\n\n1. Beismertük, hogy tehetetlenek vagyunk az alkohollal szemben –, hogy életünk irányíthatatlanná vált.\n2. Eljutottunk arra a hitre, hogy egy nálunk hatalmasabb Erő helyreállíthatja lelki egészségünket.\n3. Elhatároztuk, hogy akaratunkat és életünket a saját felfogásunk szerinti Isten gondviselésére bízzuk.\n4. Félelem nélkül mélyreható erkölcsi leltárt készítettünk magunkról.\n5. Beismertük Istennek, magunknak és egy embertársunknak hibáink valódi természetét.\n6. Teljességgel készen álltunk arra, hogy Isten megszabadítson bennünket mindezektől a jellemhibáktól.\n7. Alázatosan kértük őt hiányosságaink felszámolására.\n8. Listát készítettünk mindazokról, akiknek valaha kárára voltunk, és hajlandóvá váltunk mindnyájuknak jóvátételt nyújtani.\n9. Közvetlen jóvátételt nyújtottunk nekik, ahol lehetséges volt, kivéve, ha ez sérelmes lett volna rájuk, vagy másokra nézve.\n10. Folytattuk a személyes leltár készítését, és haladéktalanul beismertük, amikor hibáztunk.\n11. Igyekeztünk ima és meditáció útján elmélyíteni tudatos kapcsolatunkat a saját felfogásunk szerinti Istennel, csak azért imádkoztunk, hogy felismerjük velünk kapcsolatos akaratát, és hogy legyen erőnk a teljesítéséhez.\n12. E lépések eredményeként spirituális ébredést éltünk át, megpróbáltuk ezt az üzenetet alkoholistákhoz eljuttatni, és ezeket az elveket életünk minden dolgában érvényre juttatni.\n\nSokan felkiáltottunk ennek hallatára: – Micsoda követelmény! Képtelen vagyok ezt végigcsinálni! – Ne csüggedjen! Egyikünk sem volt képes ezeket az elveket teljes mértékben követni. Nem vagyunk szentek. A lényeg az, hogy hajlandók vagyunk spirituálisan fejlődni. Az itt lefektetett elvek a fejlődés felé vezetnek. Lelki fejlődésre, nem pedig tökéletességre törekszünk.\n\nJellemzésünk az alkoholistáról, az Istenben kételkedőkről (az agnosztikusokról) szóló fejezet és a kijózanodásunk előtti és utáni személyes tapasztalataink három dolgot tesznek nyilvánvalóvá:\na) Alkoholisták vagyunk, és képtelenek vagyunk életünket irányítani.\nb) Valószínűleg semmilyen emberi hatalom nem tudott volna megszabadítani alkoholizmusunktól.\nc) Isten képes erre, és megteszi, ha keressük Őt." },
  hagyomanyok12:  { title: "Az Anonim Alkoholisták 12 Hagyománya", text: "1. Közös boldogulásunk álljon az első helyen, személyes felépülésünk az A.A. egységétől függ.\n2. Csoportügyekben egyetlen abszolút tekintély létezik – egy szerető Isten –, aki csoporttudatunkban megnyilvánulhat. Vezetőink csupán bizalmunkat élvező szolgálattevők, nem pedig irányítók.\n3. Az A.A.-tagság egyetlen feltétele az ivással való felhagyás vágya.\n4. Legyen minden csoport független, kivéve azokat az ügyeket, amelyek más csoportokat, vagy az A.A. egészét érintik.\n5. Minden csoport egyetlen, elsődleges célja az, hogy eljuttassa üzenetét a még szenvedő alkoholistához.\n6. Egy A.A.-csoport soha ne adja pénzét, nevét vagy támogatását semmilyen kapcsolódó intézménynek vagy külső vállalkozásnak, nehogy a pénzzel, tulajdonnal és presztízzsel kapcsolatos problémák eltérítsék elsődleges céljától.\n7. Minden A.A.-csoport legyen teljesen önfenntartó, hárítsa el a külső hozzájárulásokat.\n8. Az Anonim Alkoholisták Közössége maradjon mindig nemhivatásos, bár szolgálati központjaink alkalmazhatnak hivatásos szakembereket.\n9. Az A.A. maga soha ne szerveződjék, de alakíthatunk szolgálati testületeket vagy bizottságokat, amelyek közvetlen felelősséggel tartoznak azoknak, akiket szolgálnak.\n10. Az Anonim Alkoholisták Közösségének nincs véleménye külső ügyekről, ezért az A.A. név soha ne legyen bevonható nyilvános vitába.\n11. A nyilvánossághoz való viszonyunk alapja elsősorban a vonzerő, nem a reklám. Személyes névtelenségünket mindig meg kell őriznünk a sajtóban, a rádióban és a filmekben.\n12. Hagyományaink spirituális alapja, a névtelenség mindig emlékeztet bennünket arra, hogy az elvek előbbre valók az egyes személyeknél." },
  zarszo1:        { title: "1. zárszó – „Könyvünket csupán ötletadónak szánjuk…”", text: "Könyvünket csupán ötletadónak szánjuk. Belátjuk, hogy még csak kevés ismerettel rendelkezünk. Isten egyre újabb és újabb dolgokat tár fel előttünk és Ön előtt is. Kérdezze meg tőle reggeli elmélkedéseiben, hogy mit tehet nap mint nap a még beteg emberekért. Választ fog találni, ha az Ön portáján rend van. De nyilvánvaló, hogy Ön nem adhat át olyasmit, amivel nem rendelkezik. Ügyeljen arra, hogy rendben legyen viszonya Istennel, és akkor nagy dolgok fognak történni Önnel és számtalan más emberrel. Ez nagy dolog számunkra.\n\nAdja át magát a saját felfogása szerinti Istennek. Vallja be neki hibáit és embertársainak is. Takarítsa el a múlt romjait. Adja tovább másoknak bőkezűen mindazt a jót, amire csak rátalál, és csatlakozzon hozzánk. Egyek leszünk Önnel a Lélek társaságában, és bizonyosan találkozik majd valamelyikünkkel sorsa örömteli beteljesítése közben.\n\nAddig is – Isten áldja és tartsa meg Önt ezen az úton." },
  zarszo2:        { title: "2. zárszó – „Újra és újra bebizonyosodik az igazság…”", text: "Újra és újra bebizonyosodik az igazság: „Aki alkoholista, az örökké az is marad.”\n\nHa valaki egy józan időszak után újra ivásra adja a fejét, akkor hamarosan oda jut, ahol azelőtt volt. Ha azt tervezzük, hogy abbahagyjuk az ivást, akkor egyáltalán nem szabad azt hinnünk, hogy egy szép napon immunisak leszünk az alkohollal szemben. A súlyos megbetegedéshez nem szükséges, hogy sokáig igyunk, vagy hogy olyan mennyiséget öntsünk magunkba, mint egyik-másik társunk. Többé már nincs arra szükség, hogy átverjem magam, akár azzal, hogy nekem másféle ivási szokásaim voltak, akár azzal, hogy „meggyógyultam”. Ma alkoholista vagyok, holnap ugyanúgy az leszek.\n\nAlkoholizmusom bennem él, ma és mindörökké. Nem szabad elfelejtenem, mi vagyok, az alkohol egész biztosan elpusztít, ha a betegségemről megfeledkezem, és nem veszem tudomásul nap mint nap.\n\nNem olyan játszma ez, amelyben a veszteség csak átmeneti hátráltató tényező. Foglalkozom a betegségemmel, melyre nincs más gyógymód, csak a mindennapi elfogadás és az éberség." },
  ima:            { title: "A Lelki Béke Imája", text: "Istenem, adj lelki békét annak elfogadására, amin változtatni nem tudok,\nbátorságot, hogy változtassak azon, amin tudok,\nés bölcsességet, hogy felismerjem a különbséget." }
};

/* =====================================================================
   A GYŰLÉS MENETE
   say:   amit a levezető hangosan mond ({nev}, {csoport}, {tipus}, {tema} behelyettesítődik)
   note:  teendő / emlékeztető a levezetőnek (nem kell felolvasni)
   read:  lenyitható felolvasandó szöveg kulcsa (READINGS)
   yes/no: két gomb → következő lépés azonosítója
   next:  egy „Tovább” gomb
   ===================================================================== */
const STEPS = {
  nyitas: { sec:"Megnyitás", title:"Köszöntés",
    say:["Szervusztok! Szeretettel köszöntök mindenkit az Anonim Alkoholisták {csoport} csoportjának {tipus} gyűlésén!",
         "{nev} vagyok, alkoholista."],
    next:"erdeklodo" },

/* A haladásjelző sávhoz: a fő vonal sorrendje */
const MAIN = ["nyitas","meghatarozas","orom","szabalyok","uj","telefon","erem","szulinap","hogyan","hagyomanyok",
  "kovtema","temaatadas","hozzaszolasok","hetedik","vege","zarszo","ima","_rogzites","_vege"];
function progress(){
  const path = state.history.concat(state.current);
  for(let i=path.length-1;i>=0;i--){ const k = MAIN.indexOf(path[i]); if(k>=0) return k/(MAIN.length-1); }
  return 0;
}

/* ===================================================================== */
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};

const settings = Object.assign({
  nev:"", tipus:"nyitott", csoport:"dunaújvárosi Felépülők", tema:"", hossz:60, lgyHossz:45, fs:20, dark:false
}, store.get("aa_settings", {}));
/* régi alapértelmezés cseréje (a korábbi papír mintájáról maradt) */
if(settings.csoport === "székesfehérvári Lelki Ébredés" || settings.csoport === "dunaújvárosi Felépülés"){ settings.csoport = "dunaújvárosi Felépülők"; try{ localStorage.setItem("aa_settings", JSON.stringify(settings)); }catch(e){} }

let state = store.get("aa_session", null); // {current, history, start}
/* 5 óránál régebbi, félbehagyott gyűlés eldobása */
if(state && (!state.start || Date.now() - state.start > 5*3600000)){ state = null; try{ localStorage.removeItem("aa_session"); }catch(e){} }
let showHome = true;   // megnyitáskor mindig a kezdőlap; gyűlés csak gombnyomásra indul / folytatódik
let wakeLock = null, wlStatus = "";

function saveSettings(){ store.set("aa_settings", settings); }
function saveSession(){ if(state) store.set("aa_session", state); else store.del("aa_session"); }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fill(t){
  return t.replace(/\{nev\}/g, settings.nev ? esc(settings.nev) : "<i>(keresztneved)</i>")
          .replace(/\{csoport\}/g, esc(settings.csoport || "…"))
          .replace(/\{tipus\}/g, esc(settings.tipus))
          .replace(/\{tema\}/g, settings.tema ? esc(settings.tema) : "……………");
}

function applyLook(){
  document.documentElement.style.setProperty("--fs", settings.fs+"px");
  document.body.classList.toggle("dark", !!settings.dark);
}

/* ---------- óra ---------- */
function fmt(ms){ const m = Math.floor(Math.abs(ms)/60000); const h = Math.floor(m/60); return (h? h+":"+String(m%60).padStart(2,"0") : m)+" p"; }
function tick(){
  const c = $("clock");
  const lgyOra = view==="lgy" && typeof lgy!=="undefined" && lgy && lgyBent && lgy.start && lgy.lepes < LGY_LEPESEK.length-1;
  const active = lgyOra || (state && state.start && state.current!=="_vege" && !showHome && !view);
  if(!active){ c.innerHTML = ""; document.body.classList.remove("ending"); return; }
  const kezd = lgyOra ? lgy.start : state.start, perc = lgyOra ? (settings.lgyHossz||45) : settings.hossz;
  const el = Date.now() - kezd, left = perc*60000 - el;
  c.innerHTML = "<b>"+fmt(el)+"</b><br>"+(left>=0 ? "még "+fmt(left) : "<span class='over'>+"+fmt(left)+"</span>");
  /* az utolsó perctől (és túllépéskor) színes háttér */
  document.body.classList.toggle("ending", !!active && left <= 60000);
}
setInterval(tick, 5000);

/* ---------- képernyő ébren tartása ---------- */
async function keepAwake(){
  try{
    if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); wlStatus = "A képernyő ébren marad."; }
    else wlStatus = "Ez a böngésző nem tudja ébren tartani a képernyőt – állítsd hosszabbra a kijelző időkorlátját.";
  }catch(e){ wlStatus = "A képernyő ébren tartása itt nem engedélyezett."; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && state && state.current!=="_vege") keepAwake(); });

/* ---------- megerősítő ablak ---------- */
function ask(text, onYes){
  $("modalText").textContent = text; $("modalYes").textContent = "Igen"; $("modal").classList.add("on");
  $("modalYes").onclick = ()=>{ $("modal").classList.remove("on"); onYes(); };
  $("modalNo").onclick = ()=> $("modal").classList.remove("on");
}

/* ---------- navigáció ---------- */
function go(id){ while(STEPS[id] && STEPS[id].kihagy && settings.tipus !== "nyitott") id = STEPS[id].kihagy; state.history.push(state.current); state.current = id; saveSession(); render(); window.scrollTo(0,0); }
function back(){ if(!state.history.length) return; state.current = state.history.pop(); saveSession(); render(); window.scrollTo(0,0); }

function startMeeting(){
  showHome = false;
  state = { current:"nyitas", history:[], start:Date.now() };
  saveSession(); keepAwake(); render();
}

/* ---------- egy lépés ---------- */
function render(){
  if(!kapcs.kod){ renderBelepes(); return; }
  if(view){ renderView(); return; }
  if(!state || showHome){ renderHome(); return; }
  tick();
  if(state.current === "_vege"){
    try{ wakeLock && wakeLock.release(); }catch(e){}
    $("hdrTitle").textContent = "Vége";
    $("bar").style.width = "100%";
    $("main").innerHTML = `<div class="done"><div class="big"><svg class="ic" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19l7-7"/></svg></div><h1>A gyűlés véget ért</h1>
      <p class="muted">Időtartam: ${fmt(Date.now()-state.start)}</p></div>`;
    $("foot").innerHTML = `<div class="row"><button class="back" id="bk">← Vissza</button><button class="back" id="hm">Kezdőlap</button></div>`;
    $("bk").onclick = back;
    $("hm").onclick = ()=>{ state.current="_vege"; saveSession(); showHome=true; render(); };
    return;
  }

  $("hdrTitle").textContent = s.sec;
  $("bar").style.width = Math.round(100*progress())+"%";

  let h = `<div class="section">${s.sec}</div><h1>${s.title}</h1>`;
  if(s.say) h += `<div class="say">${s.say.map(p=>"<p>"+fill(p)+"</p>").join("")}</div>`;
  if(s.input) h += `<label class="field"><span>${s.input.label}</span><input id="f_in" value="${esc(settings[s.input.key]||"")}"></label>`;
  if(s.read) [].concat(s.read).forEach(key=>{
    const r = READINGS[key];
    h += `<details class="reading"${s.readOpen?" open":""}><summary><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg> ${r.title}</summary><div class="body">${
      r.text ? esc(r.text) : "<span class='ph'>A szöveg még nincs beírva. Ha elküldöd, beteszem ide, és akkor innen is felolvasható lesz.</span>"}</div></details>`;
  });
  if(s.note) h += `<p class="note">${s.note}</p>`;
  if(wlStatus && state.current==="nyitas") h += `<p class="wl">${wlStatus}</p>`;
  $("main").innerHTML = h;

  if(s.input){
    $("f_in").addEventListener("input", e=>{
      settings[s.input.key] = e.target.value.trim(); saveSettings();
      document.querySelector(".say").innerHTML = s.say.map(p=>"<p>"+fill(p)+"</p>").join("");
    });
  }

  let f = "";
  if(s.yes){
    f += `<div class="choices">
      <button class="btn ${s.yesStyle||"yes"}" id="bYes">${s.yesLabel||"Van"}</button>
      <button class="btn ${s.noStyle||"no"}" id="bNo">${s.noLabel||"Nincs"}</button></div>`;
  } else {
    f += `<div class="choices"><button class="btn next" id="bNext">${s.nextLabel||"Tovább →"}</button></div>`;
  }
  f += `<button class="back" id="bBack" ${state.history.length?"":"disabled"}>← Vissza</button>`;
  $("foot").innerHTML = f;
  if(s.yes){ $("bYes").onclick = ()=>go(s.yes); $("bNo").onclick = ()=>go(s.no); }
  else $("bNext").onclick = ()=>go(s.next);
  $("bBack").onclick = back;
}

async function api(body){
  if(!kapcs.url) throw new Error("Nincs beállítva a szkript címe (Hozzáférés → Haladó beállítások).");
  if(!kapcs.pin) throw new Error("Nincs megadva a PIN-kód (Kezdőlap → Hozzáférés).");
  let r;
  try{ r = await fetch(kapcs.url, { method:"POST", body: JSON.stringify(Object.assign({ pin: kapcs.pin }, body)) }); }
  catch(e){ const err = new Error("Nincs kapcsolat (nincs térerő, vagy ez az oldal nem érheti el a táblázatot)."); err.halozat = true; throw err; }
  let j; try{ j = await r.json(); }catch(e){ const err = new Error("Érthetetlen válasz a táblázattól."); err.halozat = true; throw err; }
  if(!j.ok) throw new Error(j.hiba || "Ismeretlen hiba.");
  return j;
}

/* csoportkóddal hívható műveletek (belépés, névsor, Társaim) – PIN nem kell */
async function apiKod(body, kod){
  let r;
  try{ r = await fetch(kapcs.url, { method:"POST", body: JSON.stringify(Object.assign({ kod: kod || kapcs.kod }, body)) }); }
  catch(e){ const err = new Error("Nincs kapcsolat (nincs térerő?)."); err.halozat = true; throw err; }
  let j; try{ j = await r.json(); }catch(e){ const err = new Error("Érthetetlen válasz a táblázattól."); err.halozat = true; throw err; }
  if(!j.ok){ const err = new Error(j.hiba || "Ismeretlen hiba."); err.rosszKod = /csoportkód/i.test(j.hiba||""); throw err; }
  return j;
}

/* ===================== TÁRSAIM ===================== */
function telSzep(t){
  const d = String(t||"").replace(/\D/g,"");
  if(!d) return "";
  const m = /^36(1)(\d{3})(\d{4})$/.exec(d) || /^36(\d{2})(\d{3})(\d{3,4})$/.exec(d);
  return m ? "+36 " + m.slice(1).join(" ") : (d.length>6 ? "+" + d : d);
}
function jozanIdo(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDatum(d)); if(!m) return "";
  const k = new Date(+m[1], m[2]-1, +m[3]), most = new Date();
  let ev = most.getFullYear()-k.getFullYear(), ho = most.getMonth()-k.getMonth();
  if(most.getDate() < k.getDate()) ho--;
  if(ho < 0){ ev--; ho += 12; }
  if(ev > 0) return ev + " év" + (ho ? " " + ho + " hónap" : "");
  if(ho > 0) return ho + " hónap";
  return Math.max(0, Math.floor((most-k)/86400000)) + " nap";
}

      ${t.jozan?`<br><span class="muted">Első józan nap: ${esc(hosszuDatum(t.jozan))}${jozanIdo(t.jozan)?` (${esc(jozanIdo(t.jozan))})`:""}</span>`:""}

/* --- várólista: minden írás ide kerül, és innen megy ki --- */
function sorba(action, tetelek, leiras){
  sor.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), action, tetelek, leiras, ido: Date.now() });
  saveSor();
  szinkron();
}
async function szinkron(){
  if(syncFut || !sor.length) { updateSorJelzo(); return; }
  syncFut = true; syncAllapot = "Küldés…"; updateSorJelzo();
  try{
    while(sor.length){
      const t = sor[0];
      try{ await api({ action:t.action, tetelek:t.tetelek }); }
      catch(e){
        if(e.halozat){ syncAllapot = "Nincs kapcsolat – a tételek a telefonon várnak, később újraküldöm."; break; }
        t.hiba = e.message; saveSor(); syncAllapot = "Hiba: " + e.message; break;
      }
      sor.shift(); saveSor(); syncAllapot = "Minden elküldve.";
    }
    if(!sor.length){ try{ await frissit(); }catch(e){} }
  } finally { syncFut = false; updateSorJelzo(); if(view) render(); }
}
window.addEventListener("online", szinkron);
setInterval(()=>{ if(sor.length && !sor[0].hiba) szinkron(); }, 60000);

function updateSorJelzo(){
  const el = $("sorJelzo"); if(!el) return;

      <button class="mini" data-del="${i}">Törlés</button></div>`).join("") || `<p class="muted">Nincs várakozó tétel.</p>`;
  nezetKeret("Várakozó tételek", "Hozzáférés", lista + `<p class="note">A törlés csak a telefonról törli a még el nem küldött tételt, a táblázatban nem változtat semmit.</p>`,
    sor.length?`<div class="choices"><button class="btn next" id="s_kuld">Újraküldés most</button></div>`:"");
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=> ask("Biztosan törlöd ezt a még el nem küldött tételt?", ()=>{ sor.splice(+b.dataset.del,1); saveSor(); render(); }));
  if($("s_kuld")) $("s_kuld").onclick = ()=>{ sor.forEach(t=>delete t.hiba); saveSor(); szinkron(); };

let pTipus = "Bevétel";
function renderPenztar(){
  const kat = adat ? adat.kategoriak.filter(k=> k.tipus.indexOf(pTipus)>=0 && k.nev.indexOf("összevont")<0 && k.tipus!=="Nyitó") : [];
  const egyenleg = adat ? ft(adat.egyenleg) : "–";
  nezetKeret("Pénztár", "Bevétel, kiadás", `
    <div class="big-num">${egyenleg}<span>egyenleg a táblázat szerint</span></div>
    ${allapotSor()}
    ${!adat?`<p class="note"><b>Előbb add meg a PIN-kódot</b> (Kezdőlap → Hozzáférés).</p>`:""}
    <div class="seg"><button data-t="Bevétel" class="${pTipus==="Bevétel"?"on":""}">Bevétel</button><button data-t="Kiadás" class="${pTipus==="Kiadás"?"on":""}">Kiadás</button></div>
    <label class="field"><span>Dátum</span><input id="p_datum" type="date" value="${ma()}"></label>
    <label class="field"><span>Kategória</span><select id="p_kat">${kat.map(k=>`<option>${esc(k.nev)}</option>`).join("")}</select></label>
    <label class="field"><span>Megnevezés</span><input id="p_tetel" placeholder="${pTipus==="Bevétel"?"pl. 7. Hagyomány":"pl. tea, cukor"}"></label>
    <label class="field"><span>Összeg (Ft)</span><input id="p_osszeg" type="number" inputmode="numeric" min="1" step="1"></label>
    ${pTipus==="Kiadás"?`
    <label class="field"><span>Ki vásárolt / kinek fizettünk?</span><select id="p_szem">${nevOpciok("", "– senki / bolt –")}</select></label>
    <label class="field"><span>Ki fizette ki a kasszából?</span><select id="p_kifiz">${nevOpciok("", "– válassz –")}</select></label>
    <label class="field"><span>Lelkiismereti határozat (ha van)</span><input id="p_hat" placeholder="pl. 2026. 10. 05-i gyűlés"></label>`:`
    <label class="field"><span>Megszámolta</span><select id="p_szem">${nevOpciok(rogzito(), "– válassz –")}</select></label>
    <label class="field"><span>Ellenőrizte (második számoló)</span><select id="p_ell">${nevOpciok("", "– válassz –")}</select></label>`}
    <label class="field"><span>Megjegyzés</span><input id="p_megj"></label>
    <div id="p_msg" class="msg"></div>`,
    `<div class="choices"><button class="btn yes" id="p_ment">Rögzítés</button></div>`);
  document.querySelectorAll(".seg button").forEach(b=> b.onclick = ()=>{ pTipus = b.dataset.t; render(); });
  $("p_ment").onclick = ()=>{
    const osszeg = parseInt($("p_osszeg").value,10);
    const tetel = $("p_tetel").value.trim() || $("p_kat").value;
    if(!adat) return uzen("p_msg","Előbb add meg a PIN-kódot (Kezdőlap → Hozzáférés).",false);
    if(!$("p_kat").value) return uzen("p_msg","Válassz kategóriát.",false);
    if(!(osszeg>0)) return uzen("p_msg","Adj meg egy pozitív összeget.",false);
    if(!rogzito()) return uzen("p_msg","A kezdőlapon add meg a keresztneved – az kerül a „Rögzítette” rovatba.",false);
    const t = { datum:$("p_datum").value||ma(), tipus:pTipus, kategoria:$("p_kat").value, tetel, rogzitette:rogzito() };
    let megj = $("p_megj").value.trim();
    if(pTipus==="Bevétel"){
      t.bevetel = osszeg; t.szemely = $("p_szem").value; t.ellenorizte = $("p_ell").value;
    } else {
      t.kiadas = osszeg; t.szemely = $("p_szem").value;
      const kf = $("p_kifiz").value, hat = $("p_hat").value.trim();
      if(!kf) return uzen("p_msg","Válaszd ki, ki fizette ki a kasszából.",false);
      megj = ["Kifizette: "+kf, hat?"Határozat: "+hat:"", megj].filter(Boolean).join(". ");
    }
    t.megjegyzes = megj;
    ask(`Rögzíted? ${pTipus}: ${tetel}, ${ft(osszeg)}`, ()=>{
      sorba("naplo",[t], `${pTipus}: ${tetel} – ${ft(osszeg)}`);
      if(adat){ adat.egyenleg += pTipus==="Bevétel"?osszeg:-osszeg; store.set("aa_adatok",adat); }
      render(); uzen("p_msg","✓ Rögzítve"+(navigator.onLine?"":" – térerő esetén elküldöm")+".",true);
    });
  };
}

function cikkPanel(k){
  const erme = k.fajta === "Érme";
  $("modalText").innerHTML = `<b>${esc(k.cikk)}</b><br><span class="muted">Készlet: ${k.db} db${k.ar!=null?" · "+ft(k.ar):""}</span>
    <div class="seg" id="cp_seg">${(erme?["Átadás","Beszerzés","Javítás"]:["Eladás","Beszerzés","Ajándék","Javítás"]).map((m,i)=>`<button data-m="${m}" class="${i===0?"on":""}">${m}</button>`).join("")}</div>
    <label class="field"><span id="cp_dbl">Darab</span><input id="cp_db" type="number" inputmode="numeric" value="1" step="1"></label>
    <div id="cp_extra"></div><div id="cp_msg" class="msg"></div>`;
  let mod = erme ? "Átadás" : "Eladás";
  const extra = ()=>{
    $("cp_dbl").textContent = mod==="Javítás" ? "Eltérés (+ vagy − darab)" : "Darab";
    $("cp_extra").innerHTML =
      mod==="Eladás" ? `<p class="muted">Bevétel: <b id="cp_ossz"></b> → „Irodalom eladás”</p>` :
      mod==="Beszerzés" ? `<label class="field"><span>A kasszából kifizetett összeg (ha most fizettük)</span><input id="cp_ft" type="number" inputmode="numeric" placeholder="0 = nem most / nem a kasszából"></label>
          <label class="field"><span>Ki vásárolta?</span><select id="cp_szem">${nevOpciok("", "–")}</select></label>
          <label class="field"><span>Ki fizette ki?</span><select id="cp_kif">${nevOpciok("", "–")}</select></label>` :
      `<label class="field"><span>Megjegyzés${mod==="Javítás"?" (kötelező)":""}</span><input id="cp_megj"></label>`;
    const o = $("cp_ossz"); if(o){ const f=()=>o.textContent = ft((parseInt($("cp_db").value,10)||0)*(k.ar||0)); f(); $("cp_db").oninput=f; }
  };
  extra();
  document.querySelectorAll("#cp_seg button").forEach(b=> b.onclick = ()=>{ mod=b.dataset.m; document.querySelectorAll("#cp_seg button").forEach(x=>x.classList.toggle("on",x===b)); extra(); });
  $("modal").classList.add("on");
  $("modalNo").onclick = ()=> $("modal").classList.remove("on");
  $("modalYes").textContent = "Rögzítés";
  $("modalYes").onclick = ()=>{
    const db = parseInt($("cp_db").value,10);
    if(!rogzito()) return uzen("cp_msg","A kezdőlapon add meg a keresztneved.",false);
    if(!db || (mod!=="Javítás" && db<0)) return uzen("cp_msg","Adj meg érvényes darabszámot.",false);
    const alap = { datum:ma(), cikk:k.cikk, rogzitette:rogzito() };
    let ktetel, naplo = null, leiras;
    if(mod==="Eladás"){
      if(db > k.db) return uzen("cp_msg",`Csak ${k.db} db van a készletben. Ha mégis van több, előbb javítsd a készletet.`,false);
      ktetel = Object.assign({ tipus:"Eladás", valtozas:-db }, alap);
      if(k.ar) naplo = { datum:ma(), tipus:"Bevétel", kategoria:"Irodalom eladás", tetel:k.cikk, db, bevetel:db*k.ar, rogzitette:rogzito() };
      leiras = `Eladás: ${db} × ${k.cikk}`;
    } else if(mod==="Átadás"){
      if(db > k.db) return uzen("cp_msg",`Csak ${k.db} db van a készletben.`,false);
      ktetel = Object.assign({ tipus:"Érmeátadás", valtozas:-db }, alap); leiras = `Érmeátadás: ${db} × ${k.cikk}`;
    } else if(mod==="Beszerzés"){
      const fizetve = parseInt($("cp_ft").value,10)||0, szem=$("cp_szem").value, kif=$("cp_kif").value;
      ktetel = Object.assign({ tipus:"Beszerzés", valtozas:db, szemely:szem }, alap);
      if(fizetve>0){
        if(!kif) return uzen("cp_msg","Válaszd ki, ki fizette ki a kasszából.",false);
        naplo = { datum:ma(), tipus:"Kiadás", kategoria: erme?"Érme beszerzés":"Irodalom beszerzés", tetel:k.cikk, db, kiadas:fizetve, szemely:szem, rogzitette:rogzito(), megjegyzes:"Kifizette: "+kif };
      }
      leiras = `Beszerzés: ${db} × ${k.cikk}`;
    } else {
      const megj = $("cp_megj").value.trim();
      if(mod==="Javítás" && !megj) return uzen("cp_msg","Javításnál írd le az okát.",false);
      if(mod==="Ajándék" && db > k.db) return uzen("cp_msg",`Csak ${k.db} db van a készletben.`,false);
      ktetel = Object.assign({ tipus:mod, valtozas: mod==="Ajándék"?-db:db, megjegyzes:megj }, alap);
      leiras = `${mod}: ${db} × ${k.cikk}`;
    }
    sorba("keszlet",[ktetel], leiras);
    if(naplo){ sorba("naplo",[naplo], (naplo.tipus)+": "+k.cikk+" – "+ft(naplo.bevetel||naplo.kiadas)); adat.egyenleg += naplo.bevetel? naplo.bevetel : -naplo.kiadas; }
    k.db += ktetel.valtozas; store.set("aa_adatok", adat);
    $("modal").classList.remove("on"); $("modalYes").textContent = "Igen"; render();
  };
}

  $("vVissza").onclick = ()=>{ view="keszlet"; render(); };
  $("vVissza").textContent = "← Vissza a készlethez (a beírt számok megmaradnak)";
  $("l_kesz").onclick = ()=>{
    const sz = $("l_sz").value, el = $("l_el").value;
    if(!sz || !el || sz===el) return uzen("l_msg","Válassz két különböző személyt (számolta, ellenőrizte).",false);
    const valt = adat.keszlet.filter(k=> leltarSzam[k.cikk]!=null && !isNaN(leltarSzam[k.cikk]) && leltarSzam[k.cikk]!==k.db)
      .map(k=>({ datum:ma(), tipus:"Leltár", cikk:k.cikk, valtozas: leltarSzam[k.cikk]-k.db, szemely:sz, rogzitette:rogzito()||sz, megjegyzes:`Leltár: megszámolva ${leltarSzam[k.cikk]} db (eddig ${k.db}). Ellenőrizte: ${el}` }));
    if(!valt.length) return uzen("l_msg","Nincs eltérés – nincs mit rögzíteni.",true);
    ask(`${valt.length} tételnél van eltérés. Rögzíted a leltárt?`, ()=>{
      sorba("keszlet", valt, `Leltár: ${valt.length} tétel`);
      valt.forEach(v=>{ const k = adat.keszlet.find(x=>x.cikk===v.cikk); k.db += v.valtozas; });
      store.set("aa_adatok", adat); leltarSzam = {};
      view = "keszlet"; render();
    });
  };
}

    <label class="field"><span>7. Hagyomány – összeg (Ft)</span><input id="r_7h" type="number" inputmode="numeric" min="0" step="1"></label>

  $("r_ok").onclick = ()=>{
    const osszeg = parseInt($("r_7h").value,10);

    if(osszeg>0 && (!sz || !el || sz===el)) return uzen("r_msg","A pénzt két különböző ember számolja: válaszd ki mindkettőt.",false);
    const d = new Date(state.start); const datum = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const kt = [];
    ermek.forEach((e,i)=>{ const n = parseInt($("r_e"+i).value,10)||0; if(n>0) kt.push({ datum, tipus:"Érmeátadás", cikk:e.cikk, valtozas:-n, rogzitette:rogzito() }); });
    for(let i=0;i<szulinap;i++){ const v = $("r_szn"+i).value; if(v) kt.push({ datum, tipus:"Érmeátadás", cikk:v, valtozas:-1, rogzitette:rogzito(), megjegyzes:"Születésnap" }); }
    const ossz = `7. Hagyomány: ${ft(osszeg)}` + (kt.length?`, érmék: ${kt.reduce((a,t)=>a-t.valtozas,0)} db`:"");
    ask(`Rögzíted? ${ossz}`, ()=>{
      if(osszeg>0){
        sorba("naplo",[{ datum, tipus:"Bevétel", kategoria:"7. Hagyomány", tetel:"7. Hagyomány", bevetel:osszeg, szemely:sz, ellenorizte:el, rogzitette:rogzito() }], `7. Hagyomány – ${ft(osszeg)}`);
        if(adat){ adat.egyenleg += osszeg; }
      }
      if(kt.length){
        sorba("keszlet", kt, `Érmeátadás: ${kt.length} sor`);

      }
      if(adat) store.set("aa_adatok", adat);
      state.rogzitve = true; saveSession(); go("_vege");
    });

const LGY_LEPESEK = ["Köszöntés", "12 Hagyomány", "Jelenlévők", "Jegyzőkönyvvezető", "Napirendi pontok", "Jegyzetek", "Békeima", "Kész"];

/* „1999. 01. 14.” vagy „1999-01-14” → „1999-01-14” */
function isoDatum(d){ const m = /^(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D*$/.exec(String(d||"").trim()); return m ? m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0") : ""; }
function hosszuDatum(d){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDatum(d)||d||""); return m ? new Date(+m[1], m[2]-1, +m[3]).toLocaleDateString("hu-HU",{year:"numeric",month:"long",day:"numeric"}) : (d||""); }
function lgySzoveg(g){
  let t = "Lelkiismereti gyűlés – Anonim Alkoholisták " + (settings.csoport||"") + " csoport\n";
  t += "Dátum: " + hosszuDatum(g.datum) + "\n";
  if(g.letszam !== "") t += "Jelenlévők száma: " + g.letszam + " fő" + (g.tag !== "" ? ", ebből " + g.tag + " fő honi csoporttag" : "") + "\n";
  if(g.jkv) t += "Jegyzőkönyvvezető: " + g.jkv + "\n";
  const behuz = (j, b) => (j||"").trim() ? (j.trim().split("\n").map(x=> b + x).join("\n") + "\n") : "";
  const fj = g.fixJegyzet || [], pj = g.pontJegyzet || [];
  t += "\nNapirendi pontok:\n";
  LGY_FIX.forEach((p,i)=>{ t += (i+1) + ". " + p + "\n" + behuz(fj[i], "   "); });
  t += "4. Egyéb napirendi pontok" + (g.pontok.length ? ":" : ": –") + "\n";
  g.pontok.forEach((p,i)=>{ t += "   4." + (i+1) + ". " + p + "\n" + behuz(pj[i], "        "); });
  if((g.jegyzet||"").trim()) t += "\nEgyéb jegyzet:\n" + g.jegyzet.trim() + "\n";
  return t;
}
function lgyFajlnev(g){ return "LGY_" + (g.datum||ma()) + ".txt"; }
async function lgyMegoszt(g){
  const t = lgySzoveg(g);
  try{
    const f = new File([t], lgyFajlnev(g), { type: "text/plain" });
    if(navigator.canShare && navigator.canShare({ files:[f] })){ await navigator.share({ files:[f], title: "Lelkiismereti gyűlés" }); return; }
    if(navigator.share){ await navigator.share({ title: "Lelkiismereti gyűlés", text: t }); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  lgyLetolt(g);
}
function lgyLetolt(g){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lgySzoveg(g)], { type: "text/plain;charset=utf-8" }));
  a.download = lgyFajlnev(g); document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function lgyMasol(g, msgId){
  try{ await navigator.clipboard.writeText(lgySzoveg(g)); uzen(msgId, "Kimásolva – beillesztheted bárhová.", true); }
  catch(e){ uzen(msgId, "A másolás itt nem sikerült – használd a Megosztás gombot.", false); }
}
function lgyArchival(){
  const i = lgyLista.findIndex(x=>x.id===lgy.id);
  const masolat = JSON.parse(JSON.stringify(lgy)); delete masolat.lepes;
  if(i>=0) lgyLista[i] = masolat; else lgyLista.unshift(masolat);
  store.set("aa_lgy_lista", lgyLista);
}

function renderLgy(){
  if(!lgy || !lgyBent){ renderLgyKezdo(); return; }
  const L = lgy.lepes, n = LGY_LEPESEK.length;
  $("hdrTitle").textContent = "Lelkiismereti gyűlés";
  $("bar").style.width = Math.round(100*L/(n-1)) + "%";
  let h = `<div class="lepesek">${L+1}. / ${n}</div><div class="section">Lelkiismereti gyűlés</div><h1>${LGY_LEPESEK[L]}</h1>`;
  const olvas = key => { const r = READINGS[key]; return `<details class="reading"><summary>${esc(r.title)}</summary><div class="body">${esc(r.text)}</div></details>`; };

  if(L===0){
    h += `<div class="say"><p>Szervusztok! Szeretettel köszöntök mindenkit az Anonim Alkoholisták ${esc(settings.csoport||"…")} csoportjának lelkiismereti gyűlésén!</p>
      <p><span id="g_nevKi">${settings.nev?esc(settings.nev):"<i>(keresztneved)</i>"}</span> vagyok, alkoholista, a csoport titkára.</p></div>
      <label class="field"><span>A keresztneved</span><input id="g_nev" value="${esc(settings.nev)}" placeholder="pl. Vili" autocomplete="off"></label>`;
  } else if(L===1){
    h += `<div class="say"><p>Megkérem társunkat, hogy olvassa fel az Anonim Alkoholisták 12 Hagyományát!</p></div>` + olvas("hagyomanyok12")
      + `<p class="note">Annál van a szöveg, akinél a papír vagy a telefon – itt is lenyitható.</p>`;
  } else if(L===2){
    h += `<label class="field"><span>Dátum</span><input id="g_datum" type="date" value="${esc(lgy.datum)}"></label>
      <div class="row"><label class="field" style="flex:1"><span>Jelenlévők (fő)</span><input id="g_letszam" type="number" inputmode="numeric" min="0" value="${esc(lgy.letszam)}"></label>
      <label class="field" style="flex:1"><span>Ebből honi csoporttag (fő)</span><input id="g_tag" type="number" inputmode="numeric" min="0" value="${esc(lgy.tag)}"></label></div>
      <div id="g_msg" class="msg"></div><p class="note">Csak a honi csoporttagok szavazhatnak.</p>`;
  } else if(L===3){
    h += `<div class="say"><p>Ki vállalja ma a jegyzőkönyv vezetését?</p></div>
      <label class="field"><span>Jegyzőkönyvvezető</span><select id="g_jkv">${nevOpciok(lgy.jkv, "– válassz –")}</select></label>`;
  } else if(L===4){
    h += `<p class="note">Az első három pont mindig napirenden van. Ha kell, vegyetek fel egyéb pontokat – miről kellene ma megegyeznünk?</p>`;
    LGY_FIX.forEach((p,i)=> h += `<div class="pont fix"><span class="grow">${i+1}. ${esc(p)}</span></div>`);
    h += `<div class="pont fix"><span class="grow">4. Egyéb napirendi pontok</span></div>`;
    lgy.pontok.forEach((p,i)=> h += `<div class="pont"><span class="grow">4.${i+1}. ${esc(p)}</span><button class="mini" data-tor="${i}">Törlés</button></div>`);
    h += `<div class="row" style="margin-top:6px"><input id="g_pont" class="search" style="flex:1;margin:0" placeholder="Új napirendi pont…" autocomplete="off"><button class="mini" id="g_pontAdd">Hozzáad</button></div>`;
  } else if(L===5){
    lgy.fixJegyzet = lgy.fixJegyzet || ["","",""]; lgy.pontJegyzet = lgy.pontJegyzet || [];
    h += `<p class="note">Mindegyik napirendi pont alá írd, ami elhangzott vagy amiben megegyeztetek. Magától mentődik ezen a telefonon.</p>`;
    LGY_FIX.forEach((p,i)=> h += `<label class="field"><span><b>${i+1}. ${esc(p)}</b></span><textarea class="kicsi" data-fj="${i}">${esc(lgy.fixJegyzet[i]||"")}</textarea></label>`);
    lgy.pontok.forEach((p,i)=> h += `<label class="field"><span><b>4.${i+1}. ${esc(p)}</b></span><textarea class="kicsi" data-pj="${i}">${esc(lgy.pontJegyzet[i]||"")}</textarea></label>`);
    h += `<label class="field"><span><b>Egyéb jegyzet</b></span><textarea class="kicsi" id="g_jegyzet">${esc(lgy.jegyzet)}</textarea></label>`;
  } else if(L===6){
    h += `<div class="say"><p>Köszönöm, hogy szolgálhattam! Zárjuk a gyűlést a Lelki Béke Imájával!</p></div>` + olvas("ima");
  } else {
    h += `<p class="muted">Elmentve ezen a telefonon. Innen megoszthatod (e-mail, Messenger, Drive…), vagy fájlként letöltheted.</p>
      <div class="osszegzo">${esc(lgySzoveg(lgy))}</div><div id="g_msg2" class="msg"></div>
      <div class="row" style="margin-top:6px"><button class="mini" id="g_masol">Másolás</button><button class="mini" id="g_letolt">Letöltés (.txt)</button></div>`;
  }
  $("main").innerHTML = h;

  const ment = ()=> lgyMent();
  if(L===0) $("g_nev").oninput = e=>{ settings.nev = e.target.value.trim(); saveSettings(); $("g_nevKi").innerHTML = settings.nev ? esc(settings.nev) : "<i>(keresztneved)</i>"; };
  tick();
  if(L===2){
    $("g_datum").onchange = e=>{ lgy.datum = e.target.value || ma(); ment(); };
    $("g_letszam").oninput = e=>{ lgy.letszam = e.target.value; ment(); };
    $("g_tag").oninput = e=>{ lgy.tag = e.target.value; ment(); };
    { const t = szemLista() && szemLista().some(x=>x.tag) ? szemLista().filter(x=>x.tag==="igen").length : null;
      if(t!==null) $("g_tag").closest(".field").querySelector("span").textContent = `Ebből honi csoporttag (fő, a listán: ${t})`; }
  }
  if(L===3) $("g_jkv").addEventListener("change", e=>{ if(e.target.value!=="__uj__"){ lgy.jkv = e.target.value; ment(); } });
  if(L===4){
    const add = ()=>{ const v = ($("g_pont").value||"").trim(); if(!v) return; lgy.pontok.push(v); ment(); render(); setTimeout(()=>$("g_pont") && $("g_pont").focus(), 30); };
    $("g_pontAdd").onclick = add;
    $("g_pont").onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
    document.querySelectorAll("[data-tor]").forEach(b=> b.onclick = ()=>{ lgy.pontok.splice(+b.dataset.tor,1); (lgy.pontJegyzet||[]).splice(+b.dataset.tor,1); ment(); render(); });
  }
  if(L===5){
    $("g_jegyzet").oninput = e=>{ lgy.jegyzet = e.target.value; ment(); };
    document.querySelectorAll("[data-fj]").forEach(t=> t.oninput = ()=>{ lgy.fixJegyzet[+t.dataset.fj] = t.value; ment(); });
    document.querySelectorAll("[data-pj]").forEach(t=> t.oninput = ()=>{ lgy.pontJegyzet[+t.dataset.pj] = t.value; ment(); });
  }
  if(L===7){
    $("g_masol").onclick = ()=> lgyMasol(lgy, "g_msg2");
    $("g_letolt").onclick = ()=> lgyLetolt(lgy);
  }

  /* lábléc */
  let f;
  if(L < n-1){
    f = `<div class="choices"><button class="btn next" id="gNext">${L===n-2?"Gyűlés vége →":"Tovább →"}</button></div>`;
  } else {
    f = `<div class="choices"><button class="btn yes" id="gShare">Megosztás</button></div>`;
  }
  f += `<div class="row"><button class="back" id="gBack" ${L?"":"disabled"}>← Vissza</button><button class="back" id="gHome">Kezdőlap</button></div>`;
  $("foot").innerHTML = f;
  if($("gNext")) $("gNext").onclick = ()=>{
    if(L===2){
      const a = parseInt(lgy.letszam), b = parseInt(lgy.tag);
      if(!isNaN(a) && !isNaN(b) && b > a){ uzen("g_msg", "A tagok száma nem lehet több a jelenlévőknél.", false); return; }
      /* honi tagok száma a Személyek lap Tag oszlopa szerint (ha már frissült a lista) */
      const tagok = szemLista() && szemLista().some(x=>x.tag) ? szemLista().filter(x=>x.tag==="igen").length : null;
      if(tagok!==null && !isNaN(b) && b > tagok && lgy.tagFigy !== b){
        lgy.tagFigy = b; ment();
        uzen("g_msg", `A listán csak ${tagok} honi csoporttag szerepel. Ha mégis ${b} tag van jelen, nyomd meg újra a Tovább gombot – és vegyétek fel az új tagokat a Személyek lapra.`, false);
        return;
      }
    }
    if(L===4 && ($("g_pont").value||"").trim()){ lgy.pontok.push($("g_pont").value.trim()); }
    lgy.lepes++; if(lgy.lepes===n-1) lgyArchival(); ment(); render(); window.scrollTo(0,0);
  };
  if($("gShare")) $("gShare").onclick = ()=> lgyMegoszt(lgy);
  $("gBack").onclick = ()=>{ if(lgy.lepes>0){ lgy.lepes--; ment(); render(); window.scrollTo(0,0); } };
  $("gHome").onclick = ()=>{ if(lgy.lepes===n-1){ lgyArchival(); lgy = null; lgyMent(); } lgyBent = false; view = null; showHome = true; render(); window.scrollTo(0,0); };
}

function renderLgyKezdo(){
  let lista = "";
  if(lgyLista.length){
    lista = `<h2 class="sub">Korábbi jegyzetek ezen a telefonon</h2>` + lgyLista.map((g,i)=>`
      <div class="pont"><span class="grow"><b>${esc(hosszuDatum(g.datum))}</b><br><span class="muted">${g.letszam!==""?esc(g.letszam)+" fő":""}${g.jkv?" · jkv.: "+esc(g.jkv):""}</span></span>
      <button class="mini" data-meg="${i}">Megosztás</button><button class="mini" data-nyit="${i}">Szerkeszt</button><button class="mini" data-del="${i}">Törlés</button></div>`).join("");
  }
  nezetKeret("Lelkiismereti gyűlés", "Titkár", `
    <p class="muted">Végigvezet a lelkiismereti gyűlésen. A jegyzet csak ezen a telefonon tárolódik; a végén megoszthatod vagy letöltheted.</p>
    ${lista}`, `${lgy ? `<div class="choices"><button class="btn next" id="gFoly">Folytatás</button><button class="btn yes" id="gStart">Új gyűlés</button></div>`
          : `<div class="choices"><button class="btn yes" id="gStart">Lelkiismereti gyűlés indítása</button></div>`}`);
  $("gStart").onclick = ()=> lgy ? ask("Új lelkiismereti gyűlést kezdesz? A félbehagyott jegyzet elvész.", lgyUj) : lgyUj();
  if($("gFoly")) $("gFoly").onclick = ()=>{ lgyBent = true; keepAwake(); render(); window.scrollTo(0,0); };
  document.querySelectorAll("[data-meg]").forEach(b=> b.onclick = ()=> lgyMegoszt(lgyLista[+b.dataset.meg]));
  document.querySelectorAll("[data-nyit]").forEach(b=> b.onclick = ()=>{
    const nyit = ()=>{ lgy = Object.assign(JSON.parse(JSON.stringify(lgyLista[+b.dataset.nyit])), { lepes: 5 }); lgyBent = true; lgyMent(); render(); window.scrollTo(0,0); };
    lgy ? ask("A félbehagyott jegyzet elvész. Megnyitod ezt?", nyit) : nyit();
  });
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=> ask("Biztosan törlöd ezt a jegyzetet a telefonról?", ()=>{ lgyLista.splice(+b.dataset.del,1); store.set("aa_lgy_lista", lgyLista); render(); }));
}

function renderView(){
  if(view === "lgy"){ renderLgy(); return; }
  if(view === "tarsaim"){ renderTarsaim(); return; }
  ({ penztar:renderPenztar, keszlet:renderKeszlet, leltar:renderLeltar, kapcsolat:renderKapcsolat, sor:renderSor })[view]();
}

/* ---------- fejléc gombok ---------- */
$("homeBtn").onclick = ()=>{ if(view){ view = null; showHome = true; } else { showHome = !showHome; if(!state) showHome = true; } render(); };
$("sorJelzo").onclick = ()=>{ view = "sor"; render(); };
$("fsMinus").onclick = ()=>{ settings.fs = Math.max(15, settings.fs-2); saveSettings(); applyLook(); };
$("fsPlus").onclick  = ()=>{ settings.fs = Math.min(34, settings.fs+2); saveSettings(); applyLook(); };
$("darkBtn").onclick = ()=>{ settings.dark = !settings.dark; saveSettings(); applyLook(); };

applyLook();
render();
updateSorJelzo();
szinkron();
/* megnyitáskor (és ha visszatér az alkalmazásba) friss adatok a táblázatból: új nevek, készlet, egyenleg */
function hatterFrissites(){
  if(!kapcs.pin || !navigator.onLine || syncFut) return;
  if(adat && Date.now() - adat.ido < 5*60000) return;   // 5 percen belül nem kérdezi újra
  frissit().then(()=>{ if(view) render(); }).catch(()=>{});
}
hatterFrissites(); kodFrissites();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ hatterFrissites(); kodFrissites(); } });

/* ---------- offline mód (csak saját tárhelyen működik) ---------- */
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
</script>
